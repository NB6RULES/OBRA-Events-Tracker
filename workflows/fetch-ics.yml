name: Refresh calendar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download live .ics
        run: |
          curl -fsSL --retry 3 \
            "https://calendar.google.com/calendar/ical/brookes.ac.uk_jpnu264koojo6fqqn39ug9sg0k%40group.calendar.google.com/public/basic.ics" \
            -o calendar.tmp
          grep -q "BEGIN:VCALENDAR" calendar.tmp
          mv calendar.tmp calendar.ics

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || (git commit -m "Update calendar.ics" && git push)
